apiVersion: apps/v1 

kind: Deployment 
metadata:
  name : auth-depl

spec : 
  replicas: 1 
  selector:
    matchLabels:
      app: auth
  template : 
    metadata:
      labels :
        app: auth
    containers:
    - name : auth 
      image:  eltooeltoo/auth

---
apiVersion: v1
kind: Service
metadata:
  name:  auth-srv
spec:
  selector:
    app:  auth
  ports:
  - name: auth
    port:  3000
    protocol: TCP
    targetPort:  3000